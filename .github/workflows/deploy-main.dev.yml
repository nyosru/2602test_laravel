name: Deploy to VPS with Git


# Триггеры запуска:
on:
  # Автоматический запуск при пуше в main
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: 91.218.230.97
  VPS_USERNAME: root
  DIR: /home/2602test_laravel
  GIT_BRANCH: origin/main
  GITHUB_USERNAME: nyosru
  GIT_REPO: 2602test_laravel.git
  DOCKER_CONTAINER: 2602test_laravel

jobs:
  sms_start:
    runs-on: ubuntu-latest
    steps:
      - name: Send deployment start notification
        uses: appleboy/telegram-action@master
        with:
          to: 360209578, phpcat
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀🚀🚀 Начинаем деплой ${{ github.repository }}
            👨🏻‍💻 ${{ github.actor }} (${{ github.run_id }})
            📝 ${{ github.event.head_commit.message }}


  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy code to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY_DOCKER24 }}
          script: |
            set -e  # Выход при ошибке
            cd ${{ env.DIR }}
            git fetch --all
            git reset --hard ${{ env.GIT_BRANCH }}
            echo "✅ Код успешно обновлен"

            # Обновление зависимостей
            #docker exec ${{ env.DOCKER_CONTAINER }} composer install --no-dev --optimize-autoloader
            docker exec ${{ env.DOCKER_CONTAINER }} composer install --optimize-autoloader

            # Миграции
            docker exec ${{ env.DOCKER_CONTAINER }} php artisan migrate:fresh --seed

            # Сборка свагера
            docker exec ${{ env.DOCKER_CONTAINER }} make s


  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy code to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY_DOCKER24 }}
          script: |
            set -e  # Выход при ошибке

            docker exec ${{ env.DOCKER_CONTAINER }} npm install
            docker exec ${{ env.DOCKER_CONTAINER }} npm run build


  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy code to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY_DOCKER24 }}
          script: |
            set -e  # Выход при ошибке

            # Очистка кеша
            docker exec ${{ env.DOCKER_CONTAINER }} php artisan optimize:clear
            docker exec ${{ env.DOCKER_CONTAINER }} php artisan optimize

  sms_end:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Send deployment success notification
        uses: appleboy/telegram-action@master
        with:
          to: 360209578, phpcat
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🍀🍀🍀 Успешный деплой ${{ github.repository }}
            👨🏻‍💻 ${{ github.actor }} > ${{ github.run_id }}
            📝 ${{ github.event.head_commit.message }}
            🎉 Все задачи выполнены!
